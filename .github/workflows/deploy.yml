name: Deploy Yadeto

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "apps/admin/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "VERSION"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yadeto-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build React applications
        run: |
          npm run typecheck
          npm run build

      - name: Validate release
        run: |
          test -f VERSION
          test -f apps/app/dist/index.html
          test -f apps/admin/dist/index.html
          grep -q "$(cat VERSION)" apps/app/dist/version.json
          grep -q "$(cat VERSION)" apps/admin/dist/version.json

      - name: Deploy app
        env:
          FTP_SERVER: ${{ secrets.FTP_APP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_APP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_APP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_APP_PASSWORD }}
        run: |
          cd apps/app/dist
          upload_file() {
            file="$1"
            remote="${file#./}"
            curl --fail --show-error --silent --insecure --ssl-reqd --ftp-pasv \
              --connect-timeout 20 --max-time 180 --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file "$file" \
              "ftp://$FTP_SERVER:$FTP_PORT/$remote"
          }
          find . -type f ! -path './sw.js' ! -path './index.html' ! -path './version.json' -print0 | while IFS= read -r -d '' file; do
            upload_file "$file"
          done
          upload_file ./index.html
          upload_file ./sw.js
          upload_file ./version.json

      - name: Deploy admin
        env:
          FTP_SERVER: ${{ secrets.FTP_ADMIN_SERVER }}
          FTP_PORT: ${{ secrets.FTP_ADMIN_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_ADMIN_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_ADMIN_PASSWORD }}
        run: |
          cd apps/admin/dist
          upload_file() {
            file="$1"
            remote="${file#./}"
            curl --fail --show-error --silent --insecure --ssl-reqd --ftp-pasv \
              --connect-timeout 20 --max-time 180 --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file "$file" \
              "ftp://$FTP_SERVER:$FTP_PORT/$remote"
          }
          find . -type f ! -path './index.html' ! -path './version.json' -print0 | while IFS= read -r -d '' file; do
            upload_file "$file"
          done
          upload_file ./index.html
          upload_file ./version.json
