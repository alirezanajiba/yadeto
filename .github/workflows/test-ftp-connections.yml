name: Test FTP connections

on:
  push:
    branches:
      - main
    paths:
      - "connection-tests/**"
      - ".github/workflows/test-ftp-connections.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yadeto-ftp-connection-test
  cancel-in-progress: true

jobs:
  upload-test-files:
    name: Upload test files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload app connection test
        env:
          FTP_SERVER: ${{ secrets.FTP_APP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_APP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_APP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_APP_PASSWORD }}
        run: |
          curl --fail --show-error --silent --insecure \
            --ssl-reqd --ftp-pasv \
            --connect-timeout 20 --max-time 120 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file connection-tests/app/connection-test.txt \
            "ftp://$FTP_SERVER:$FTP_PORT/connection-test.txt"

      - name: Upload admin connection test
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_ADMIN_SERVER }}
          FTP_PORT: ${{ secrets.FTP_ADMIN_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_ADMIN_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_ADMIN_PASSWORD }}
        run: |
          curl --fail --show-error --silent --insecure \
            --ssl-reqd --ftp-pasv \
            --connect-timeout 20 --max-time 120 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file connection-tests/admin/connection-test.txt \
            "ftp://$FTP_SERVER:$FTP_PORT/connection-test.txt"
